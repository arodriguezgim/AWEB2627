<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro Torneo eSports</title>
</head>

<body>
    <h1>Inscripción al Torneo de Verano</h1>
    <hr>
    <form action="./registro.html" method="post">
        <p> <label for="gamertag">GamerTag / Apodo:</label> <input type="text" id="gamertag" name="gamertag"
                placeholder="Ej: ProGamer99"> </p>
        <p> <label for="fullname">Nombre Completo:</label> <input type="text" id="fullname" name="fullname"
                placeholder="Tu nombre y apellidos"> </p>
        <p> <label for="contact_email">Correo Electrónico:</label> <input type="email" id="contact_email"
                name="contact_email" placeholder="ejemplo@correo.com"> </p>
        <p> <input type="submit" value="Confirmar Inscripción"> <input type="reset" value="Limpiar Campos"> </p>
    </form>
</body>

</html>
