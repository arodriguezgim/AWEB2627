<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>

<body>
    <h1>Formularios en HTML</h1>
    <hr>
    <form action="./formulario.html" method="post">
        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe aquí tu nombre">
        </p>
        <p>
            <label for="ape">Apellidos:</label>
            <input type="text" name="Apellidos" id="ape" placeholder="Apellidos">
        </p>
        <p>
            <label for="email">Correo Electrónico</label>
            <input type="email" name="email" id="email" placeholder="E-mail">
        </p>
        <p>
            <label for="factura">Envía tu factura en pdf</label>
            <input type="file" name="factura" id="factura">
        </p>
        <p>
            <label for="comentario">Describe tu problema:</label> <br><br>
            <textarea name="comentarios" id="comentario" placeholder="Escribe aquí tu problema" cols="50" rows="6"></textarea>
        </p>
        <p>
            <input type="submit" value="Enviar Formulario">
            <input type="reset" value="Borrar Formulario">
        </p>
    </form>
</body>

</html>
