<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            border: 1px solid black;
            background-color: lightgreen;
            padding: 5px;
            /*Para usar Flex debemos usar la propiedad display*/
            display: flex;
            /*flex-direction: row; /* row es la propiedad por defecto*/
            /*flex-wrap: wrap;/*nowrap es por defecto*/
            flex-flow: row wrap;
            /* flex-flow es una regla que aglutina las dos propiedades anteriores*/
            justify-content: space-between;
            height: 500px;
            align-items: center;/*stretch es por defecto y significa que ocupen toda la altura*/

        }
        .caja {
            border: 3px solid black;
            margin: 5px;
            text-align: center;
            font-size: 25px;
            width: 150px;
            height: 150px;
            line-height: 150px;
            
        }
        .c1{
            background-color: aqua;
        }
        .c2{
            background-color: lightpink;
            font-size: 25px;
        }
        .c3{
            background-color: lightskyblue;
        }
        .c4{
            background-color: lightgoldenrodyellow;
        }
    </style>
</head>
<body>
    <h1>Curso de Flex</h1>
    <div class="container">
        <div class="caja c1">Caja 1</div>
        <div class="caja c2">Caja 2</div>
        <div class="caja c3">Caja 3</div>
        <div class="caja c4">Caja 4</div>
        <!--<div class="caja c1">Caja 5</div>
        <div class="caja c2">Caja 6</div>
        <div class="caja c3">Caja 7</div>
        <div class="caja c4">Caja 8</div>
        <div class="caja c1">Caja 9</div>
        <div class="caja c2">Caja 10</div>
        <div class="caja c3">Caja 11</div>
        <div class="caja c4">Caja 12</div>-->
    </div>
</body>
</html>
