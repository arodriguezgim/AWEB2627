<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>

        .cuadrado{
            width: 100px;
            height: 100px;
            background-color: #fef223;
            margin-bottom: 10px;
            display: inline-block;
        }
        p {
            display: inline;
        }
        a, span {
            display: block;
        }

        .oculto {
            visibility: visible;
        }
        .transparencia {
            opacity: 0.4;
        }
    </style>
</head>
<body>
    <div class="cuadrado">Inicio</div>
    <div class="cuadrado oculto transparencia">Contacto</div>
    <div class="cuadrado">Quienes somos</div>
    <h1>Hola</h1>
    <p>Alberto</p>
    <p>Esto es otro parrafo</p>


    
    <a href="#">Enlace A</a>
    <a href="#">Enlace A</a>
    <span>Hola</span>
    <span>Alberto</span>
</body>
</html>
